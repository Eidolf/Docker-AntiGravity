name: Release Manager

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      repo_lower: ${{ steps.repo.outputs.lower }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculate Version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python3 version_manager.py "$RELEASE_TYPE"

      - name: Lowercase Repository Name
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Commit Stable Version Metadata
        id: commit
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [[ "$RELEASE_TYPE" == "stable" ]]; then
            git config user.name "Antigravity Bot"
            git config user.email "bot@antigravity.dev"
            git add VERSION
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): record version ${{ steps.version.outputs.version }}"
            fi
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Architecture-Specific Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ needs.prepare.outputs.repo_lower }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: |
             CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Multi-Arch Manifest
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          REPO=ghcr.io/${{ needs.prepare.outputs.repo_lower }}
          
          docker buildx imagetools create -t ${REPO}:${VERSION} \
            ${REPO}:${VERSION}-amd64 \
            ${REPO}:${VERSION}-arm64

  publish:
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          bash scripts/create-release-tag.sh "$TAG" "$RELEASE_SHA"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type == 'nightly' }}
          make_latest: ${{ inputs.release_type == 'stable' }}

      - name: Set up Docker Buildx
        if: inputs.release_type == 'stable'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: inputs.release_type == 'stable'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Stable latest container alias
        if: inputs.release_type == 'stable'
        env:
          REPO: ghcr.io/${{ needs.prepare.outputs.repo_lower }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create -t "${REPO}:latest" "${REPO}:${VERSION}"
